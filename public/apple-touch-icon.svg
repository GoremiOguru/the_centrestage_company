<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="100" fill="#08080a" />
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4d8" />
      <stop offset="45%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#997b1a" />
    </linearGradient>
  </defs>
  <g transform="translate(256, 256)">
    <!-- Outer White Arc (C-Shape) -->
    <path d="M 0,-160 A 160,160 0 1,0 113,113 L 64,64 A 90,90 0 1,1 0,-90 Z" fill="#ffffff" />
    <!-- Gold Spotlight Wedge Segment -->
    <path d="M 0,0 L 113,-113 A 160,160 0 0,1 113,113 L 0,0 Z" fill="url(#goldGrad)" opacity="0.95" />
    <!-- Middle Dark Ring -->
    <circle cx="0" cy="0" r="90" fill="#08080a" stroke="#d4af37" stroke-width="2" />
    <!-- Inner White Arc -->
    <path d="M 0,-54 A 54,54 0 1,0 38,38 L 22,22 A 30,30 0 1,1 0,-30 Z" fill="#ffffff" />
    <!-- Inner Gold Spotlight -->
    <path d="M 0,0 L 38,-38 A 54,54 0 0,1 38,38 L 0,0 Z" fill="url(#goldGrad)" />
    <!-- Center Hub -->
    <circle cx="0" cy="0" r="30" fill="#08080a" />
  </g>
</svg>